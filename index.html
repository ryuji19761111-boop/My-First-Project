<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>アニマル進化ゲーム 3D</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#87ceeb;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;position:fixed;inset:0;}
  #canvasWrap{position:fixed;inset:0;}
  canvas{display:block;}

  /* ===== 上部 アニメ風HUD ===== */
  #hud{position:fixed;top:8px;left:8px;z-index:10;pointer-events:none;
       display:flex;align-items:center;gap:10px;
       background:linear-gradient(135deg,rgba(20,30,60,0.75),rgba(60,40,110,0.6));
       border:2px solid rgba(255,255,255,0.55);
       border-radius:14px 22px 14px 22px;
       padding:8px 16px 8px 8px;
       box-shadow:0 0 14px rgba(0,0,0,0.4), inset 0 0 8px rgba(255,255,255,0.15);
       backdrop-filter:blur(2px);}
  #levelBadge{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d6,#ffcf3f 60%,#e08a00);
       border:3px solid #fff;display:flex;align-items:center;justify-content:center;flex-direction:column;
       box-shadow:0 0 10px rgba(255,200,0,0.8);flex-shrink:0;}
  #levelBadge .lv{font-size:10px;font-weight:bold;color:#7a3d00;line-height:1;}
  #levelBadge .num{font-size:20px;font-weight:900;color:#5c2c00;line-height:1.1;}
  #hudRight{min-width:150px;}
  #stageName{font-size:17px;font-weight:900;color:#fff;letter-spacing:1px;
       text-shadow:0 0 4px #ff9df9,0 0 8px #7a4dff,0 2px 2px rgba(0,0,0,0.8);}
  #xpBarOuter{margin-top:5px;width:min(46vw,230px);height:12px;background:rgba(0,0,0,0.45);
       border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.5);position:relative;}
  #xpBarInner{height:100%;width:0%;background:linear-gradient(90deg,#3ad0ff,#8effc7,#3ad0ff);
       background-size:200% 100%;animation:xpshine 2.4s linear infinite;transition:width 0.25s;}
  @keyframes xpshine{0%{background-position:0% 0;}100%{background-position:200% 0;}}
  #statsRow{margin-top:3px;font-size:11px;color:#ffe8ff;opacity:0.9;text-shadow:0 1px 2px rgba(0,0,0,0.8);}
  #buffRow{display:flex;gap:4px;margin-top:4px;}
  .buffIcon{font-size:11px;font-weight:bold;color:#fff;padding:2px 6px;border-radius:8px;
       background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.5);display:none;}

  #instructions{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#fff;
      font-size:11px;opacity:0.85;text-shadow:0 1px 3px rgba(0,0,0,0.7);pointer-events:none;z-index:10;}

  /* ===== 右上：フルスクリーン & ミニマップ ===== */
  #topRightWrap{position:fixed;top:8px;right:8px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  #fullscreenBtn{width:42px;height:42px;border-radius:50%;background:rgba(20,20,40,0.6);
      border:2px solid rgba(255,255,255,0.6);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;}
  #minimapWrap{width:112px;height:112px;border-radius:50%;border:3px solid rgba(255,255,255,0.75);
      box-shadow:0 0 10px rgba(0,0,0,0.5);overflow:hidden;background:rgba(10,30,10,0.5);}
  #minimapCanvas{width:100%;height:100%;display:block;}

  /* ===== ジョイスティック(横向き最適化・左下) ===== */
  #joystickBase{position:fixed;left:5vw;bottom:8vh;width:110px;height:110px;border-radius:50%;
      background:rgba(255,255,255,0.16);border:2px solid rgba(255,255,255,0.4);z-index:20;touch-action:none;}
  #joystickKnob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;
      background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.75);}

  /* ===== ダッシュボタン(右下) ===== */
  #dashBtnWrap{position:fixed;right:6vw;bottom:8vh;width:86px;height:86px;z-index:20;touch-action:none;}
  #dashRing{position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(#3ad0ff calc(var(--pct,100)*1%), rgba(0,0,0,0.35) 0);}
  #dashBtn{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7be8ff,#0091c7);
      border:2px solid rgba(255,255,255,0.8);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 10px rgba(0,150,255,0.7);}

  /* ===== 進化フラッシュ ===== */
  #levelUpFlash{position:fixed;top:32%;left:0;right:0;text-align:center;pointer-events:none;
      opacity:0;transition:opacity 0.4s;z-index:30;}
  #levelUpFlash .big{font-size:40px;color:#ffe066;font-weight:900;letter-spacing:2px;
      text-shadow:0 0 16px rgba(255,220,80,0.95),0 0 6px #fff,0 2px 4px rgba(0,0,0,0.8);}
  #levelUpFlash .sub{font-size:19px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.9);margin-top:6px;font-weight:bold;}

  /* ===== ゲームオーバー/スタート ===== */
  #gameOverOverlay,#startOverlay{position:fixed;inset:0;background:rgba(5,5,20,0.85);display:none;
      align-items:center;justify-content:center;flex-direction:column;z-index:40;color:#fff;text-align:center;padding:20px;box-sizing:border-box;}
  #gameOverOverlay h1{font-size:30px;margin:0 0 8px;color:#ff6b6b;text-shadow:0 0 10px rgba(255,50,50,0.7);}
  #gameOverOverlay p{font-size:15px;margin:4px 0 20px;max-width:480px;}
  #startOverlay{display:flex;}
  #startOverlay h1{font-size:24px;color:#ffe066;margin-bottom:6px;text-shadow:0 0 12px rgba(255,220,80,0.8);}
  #startOverlay p{font-size:13px;line-height:1.8;max-width:460px;opacity:0.92;}
  .bigBtn{margin-top:16px;padding:13px 34px;font-size:19px;border:none;border-radius:30px;
      background:linear-gradient(90deg,#4fd1ff,#4fffb0);color:#00263a;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,0.4);}

  /* ===== 回転案内 ===== */
  #rotateOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;z-index:60;
      align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;}
  #rotateOverlay .icon{font-size:54px;margin-bottom:10px;animation:rotatePulse 1.4s ease-in-out infinite;}
  @keyframes rotatePulse{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
</style>
</head>
<body>

<div id="canvasWrap"></div>

<div id="hud">
  <div id="levelBadge"><div class="lv">Lv</div><div class="num" id="levelNumInner">1</div></div>
  <div id="hudRight">
    <div id="stageName">微生物</div>
    <div id="xpBarOuter"><div id="xpBarInner"></div></div>
    <div id="statsRow">サイズ <span id="statSize">-</span> ／ 次まで <span id="statXp">-</span></div>
    <div id="buffRow">
      <div class="buffIcon" id="buffShield">🛡 シールド</div>
      <div class="buffIcon" id="buffSpeed">⚡ 加速</div>
    </div>
  </div>
</div>

<div id="topRightWrap">
  <div id="fullscreenBtn">⛶</div>
  <div id="minimapWrap"><canvas id="minimapCanvas" width="200" height="200"></canvas></div>
</div>

<div id="instructions">ジョイスティックで移動、右下のボタンでダッシュ！特殊アイテムやフィールドの仕掛けも活用しよう</div>

<div id="joystickBase"><div id="joystickKnob"></div></div>
<div id="dashBtnWrap"><div id="dashRing"></div><div id="dashBtn">⚡</div></div>

<div id="levelUpFlash"><div class="big">LEVEL UP!</div><div class="sub"></div></div>

<div id="gameOverOverlay">
  <h1>やられた…！</h1>
  <p id="gameOverText"></p>
  <button class="bigBtn" id="restartBtn">もう一度挑戦</button>
</div>

<div id="startOverlay">
  <h1>アニマル進化ゲーム 3D</h1>
  <p>微生物からスタートし、30段階の進化を目指そう。<br>
     食べ物や自分より小さい生き物を食べてXP獲得。大きい敵には気をつけて！<br>
     フィールドには加速ゾーン・毒ゾーン・シールドや加速の特殊アイテムあり。<br>
     敵は状況を見て「追う・逃げる・諦める」を判断して動きます。<br>
     右下ボタンでダッシュ、右上でフルスクリーン＆ミニマップ確認！</p>
  <button class="bigBtn" id="startBtn">ゲームスタート</button>
</div>

<div id="rotateOverlay"><div class="icon">📱</div><div>スマホを横向きにしてください</div></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
"use strict";

/* ===================== 進化ステージ定義 ===================== */
const STAGE_NAMES = [
"微生物","プランクトン","稚魚","小魚","魚",
"大魚","ザリガニ","カエル","トカゲ","イグアナ",
"ワニ","小型恐竜","中型恐竜","大型恐竜","ティラノサウルス",
"有翼恐竜","プテラノドン","鷲","フェニックスの雛","フェニックス",
"グリフォン","ワイバーン","若きドラゴン","ドラゴン","古代ドラゴン",
"伝説のドラゴン","神話のドラゴン","天空の竜王","破滅の竜神","originドラゴン"
];
const MAX_LEVEL = 30;
const ARENA_RADIUS = 240;
function xpNeeded(level){ return Math.floor(40 + level*24); }

/* ===================== Three.js 基本セットアップ ===================== */
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 130, 460);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
wrap.appendChild(renderer.domElement);

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  checkOrientation();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

/* 縦向き案内 */
const rotateOverlay = document.getElementById('rotateOverlay');
function checkOrientation(){
  rotateOverlay.style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
}
checkOrientation();

/* フルスクリーン */
const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement);
    if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(()=>{}); }
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
});

/* ライト */
scene.add(new THREE.AmbientLight(0xffffff, 0.68));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(80,140,60);
scene.add(sun);

/* ===================== 地面・マップギミック ===================== */
const groundGeo = new THREE.CircleGeometry(ARENA_RADIUS+70, 48);
const groundMat = new THREE.MeshStandardMaterial({color:0x3fae5c, roughness:1});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const grid = new THREE.GridHelper(ARENA_RADIUS*2, 48, 0x2f8c48, 0x2f8c48);
grid.position.y = 0.02;
scene.add(grid);

const boundaryGeo = new THREE.RingGeometry(ARENA_RADIUS-1.2, ARENA_RADIUS+1.2, 72);
const boundaryMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, transparent:true, opacity:0.55});
const boundary = new THREE.Mesh(boundaryGeo, boundaryMat);
boundary.rotation.x = -Math.PI/2;
boundary.position.y = 0.03;
scene.add(boundary);

/* biomeパッチ(見た目のバリエーション) */
function addBiomePatch(x,z,r,color,opacity){
  const geo = new THREE.CircleGeometry(r, 28);
  const mat = new THREE.MeshStandardMaterial({color:color, transparent:true, opacity:opacity||1, roughness:1});
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x,0.015,z);
  scene.add(m);
  return m;
}
addBiomePatch(120,90,55,0xd9c27a);   // 砂地
addBiomePatch(-140,-60,60,0x2f6b3a); // 濃い森
addBiomePatch(-100,140,45,0x8fd0e0,0.85); // 湖(装飾)
addBiomePatch(150,-150,50,0x6b3fae,0.5);  // 怪しい紫地帯(毒ゾーン下地)

/* 障害物(岩・木) - 衝突あり */
const obstacles = [];
function addRock(x,z,scale){
  const geo = new THREE.DodecahedronGeometry(1,0);
  const mat = new THREE.MeshStandardMaterial({color:0x8a8a8a, roughness:0.9, flatShading:true});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, scale*0.5, z);
  m.scale.set(scale,scale,scale);
  m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
  scene.add(m);
  obstacles.push({x,z,radius:scale*1.1});
}
function addTree(x,z,scale){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3*scale,0.4*scale,2*scale,8),
      new THREE.MeshStandardMaterial({color:0x6b4423}));
  trunk.position.y = scale;
  g.add(trunk);
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4*scale,2.6*scale,8),
      new THREE.MeshStandardMaterial({color:0x2f8c48}));
  leaves.position.y = scale*2.6;
  g.add(leaves);
  g.position.set(x,0,z);
  scene.add(g);
  obstacles.push({x,z,radius:0.9*scale});
}
for(let i=0;i<22;i++){
  const ang = Math.random()*Math.PI*2, r = 40+Math.random()*(ARENA_RADIUS-50);
  addRock(Math.cos(ang)*r, Math.sin(ang)*r, 1+Math.random()*1.6);
}
for(let i=0;i<20;i++){
  const ang = Math.random()*Math.PI*2, r = 40+Math.random()*(ARENA_RADIUS-50);
  addTree(Math.cos(ang)*r, Math.sin(ang)*r, 1+Math.random()*1.2);
}

/* 加速ゾーン・毒ゾーン */
const speedZones = [{x:60,z:-40,radius:16},{x:-160,z:100,radius:18}];
const poisonZones = [{x:150,z:-150,radius:26},{x:-40,z:-170,radius:20}];
speedZones.forEach(z=>{
  const ring = new THREE.Mesh(new THREE.RingGeometry(z.radius-1.5,z.radius,32),
      new THREE.MeshBasicMaterial({color:0xfff36b, side:THREE.DoubleSide, transparent:true, opacity:0.8}));
  ring.rotation.x=-Math.PI/2; ring.position.set(z.x,0.05,z.z); scene.add(ring);
});
poisonZones.forEach(z=>{
  const ring = new THREE.Mesh(new THREE.CircleGeometry(z.radius,32),
      new THREE.MeshBasicMaterial({color:0x7a2fbf, transparent:true, opacity:0.35}));
  ring.rotation.x=-Math.PI/2; ring.position.set(z.x,0.04,z.z); scene.add(ring);
});

function resolveObstacles(pos, radius){
  for(let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    const dx = pos.x-o.x, dz = pos.z-o.z;
    const dist = Math.hypot(dx,dz);
    const minDist = radius+o.radius;
    if(dist < minDist && dist>0.0001){
      const push = (minDist-dist);
      pos.x += dx/dist*push;
      pos.z += dz/dist*push;
    }
  }
}

/* ===================== 生き物メッシュ生成 ===================== */
function createCreatureMesh(level){
  const group = new THREE.Group();
  const bucket = Math.min(5, Math.floor((level-1)/5));
  const scale = 0.6 + level*0.055;
  const hueTable = [0.55,0.45,0.09,0.72,0.11,0.0];
  const hue = hueTable[bucket];
  const light = 0.38 + (level%5)*0.05;
  const color = new THREE.Color().setHSL(hue, 0.62, light);
  const emissiveFlag = bucket>=5;
  const mat = new THREE.MeshStandardMaterial({
    color:color, roughness:0.55, metalness:0.15,
    emissive: emissiveFlag? color : 0x000000,
    emissiveIntensity: emissiveFlag? 0.55 : 0
  });

  const body = new THREE.Mesh(new THREE.SphereGeometry(1,16,12), mat);
  body.scale.set(1,0.8,1.3);
  group.add(body);

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.5,1.2,8), mat);
  tail.rotation.x = Math.PI/2;
  tail.position.z = -1.3;
  tail.scale.set(0.7,0.7,1);
  group.add(tail);

  const eyeMat = new THREE.MeshStandardMaterial({color:0x111111});
  const eyeGeo = new THREE.SphereGeometry(0.15,8,8);
  const eyeL = new THREE.Mesh(eyeGeo,eyeMat); eyeL.position.set(0.4,0.3,0.9); group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo,eyeMat); eyeR.position.set(-0.4,0.3,0.9); group.add(eyeR);

  if(bucket>=1){
    const finGeo = new THREE.ConeGeometry(0.3,0.8,6);
    const finL = new THREE.Mesh(finGeo, mat); finL.position.set(1,0,0); finL.rotation.z=Math.PI/2; group.add(finL);
    const finR = new THREE.Mesh(finGeo, mat); finR.position.set(-1,0,0); finR.rotation.z=-Math.PI/2; group.add(finR);
  }
  if(bucket>=2){
    const legGeo = new THREE.BoxGeometry(0.3,0.8,0.3);
    const positions=[[0.6,-0.6,0.6],[-0.6,-0.6,0.6],[0.6,-0.6,-0.6],[-0.6,-0.6,-0.6]];
    positions.forEach(p=>{ const leg=new THREE.Mesh(legGeo,mat); leg.position.set(p[0],p[1],p[2]); group.add(leg); });
  }
  if(bucket>=3){
    const spikeGeo = new THREE.ConeGeometry(0.2,0.5,6);
    for(let i=0;i<5;i++){
      const s=new THREE.Mesh(spikeGeo,mat);
      s.position.set(0,1,0.9-i*0.5);
      group.add(s);
    }
  }
  if(bucket>=4){
    const wingGeo = new THREE.BoxGeometry(1.6,0.1,0.8);
    const wingL = new THREE.Mesh(wingGeo,mat); wingL.position.set(1.3,0.3,0); wingL.rotation.z=0.3; group.add(wingL);
    const wingR = new THREE.Mesh(wingGeo,mat); wingR.position.set(-1.3,0.3,0); wingR.rotation.z=-0.3; group.add(wingR);
  }
  if(bucket>=5){
    const hornGeo = new THREE.ConeGeometry(0.15,0.6,6);
    const hornL = new THREE.Mesh(hornGeo,mat); hornL.position.set(0.3,0.9,0.8); hornL.rotation.x=-0.3; group.add(hornL);
    const hornR = new THREE.Mesh(hornGeo,mat); hornR.position.set(-0.3,0.9,0.8); hornR.rotation.x=-0.3; group.add(hornR);
    const glow = new THREE.PointLight(color, 1.1, 6);
    glow.position.set(0,0.5,0);
    group.add(glow);
  }

  group.scale.set(scale,scale,scale);
  group.userData.radius = scale*1.35;
  return group;
}

/* ===================== ラベル(アニメ風 Lv バッジ) ===================== */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function makeLabelTexture(text, bgColor, borderColor){
  const cnv = document.createElement('canvas');
  cnv.width=140; cnv.height=64;
  const ctx = cnv.getContext('2d');
  roundRect(ctx,6,14,128,38,19);
  ctx.fillStyle = bgColor; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=borderColor; ctx.stroke();
  ctx.font='bold 26px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.65)';
  ctx.strokeText(text,70,33);
  ctx.fillStyle='#fff';
  ctx.fillText(text,70,33);
  return new THREE.CanvasTexture(cnv);
}
const LABEL_COLORS = {
  danger:{bg:'#c0392b', border:'#ffe27a'},
  prey:{bg:'#1f9d55', border:'#e3fff0'},
  neutral:{bg:'#555b66', border:'#e0e0e0'}
};
function createEnemyLabel(enemy){
  const tex = makeLabelTexture('Lv.'+enemy.level, LABEL_COLORS.neutral.bg, LABEL_COLORS.neutral.border);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(2.4,1.1,1);
  spr.position.y = enemy.radius + 1.7;
  spr.renderOrder = 999;
  enemy.root.add(spr);
  enemy.labelSprite = spr;
  enemy.labelState = 'neutral';
  enemy.labelLevelShown = enemy.level;
  enemy.labelTimer = 0;
}
function updateEnemyLabel(enemy, dt){
  enemy.labelTimer -= dt;
  if(enemy.labelTimer > 0) return;
  enemy.labelTimer = 0.35;
  const ratio = enemy.radius / player.radius;
  let state = 'neutral';
  if(ratio > 1.12) state = 'danger';
  else if(ratio < 0.9) state = 'prey';
  if(state !== enemy.labelState || enemy.level !== enemy.labelLevelShown){
    enemy.labelState = state;
    enemy.labelLevelShown = enemy.level;
    const c = LABEL_COLORS[state];
    if(enemy.labelSprite.material.map) enemy.labelSprite.material.map.dispose();
    enemy.labelSprite.material.map = makeLabelTexture('Lv.'+enemy.level, c.bg, c.border);
    enemy.labelSprite.material.needsUpdate = true;
  }
  enemy.labelSprite.position.y = enemy.radius + 1.7;
}

/* ===================== プレイヤー ===================== */
const PLAYER_BASE_SPEED = 8;
const ENEMY_BASE_SPEED = 7.2;
const player = {
  level:1, xp:0, root:new THREE.Group(), mesh:null,
  radius:1, speed:9, facing:0, alive:true,
  shieldTime:0, speedBoostTime:0
};
scene.add(player.root);
function rebuildPlayerMesh(){
  if(player.mesh) player.root.remove(player.mesh);
  player.mesh = createCreatureMesh(player.level);
  player.root.add(player.mesh);
  player.radius = player.mesh.userData.radius;
  player.speed = PLAYER_BASE_SPEED; // レベルが上がってもスピードは変わらない(体は大きくなる)
}
rebuildPlayerMesh();

/* ===================== 食べ物・アイテム ===================== */
const foodItems = [];
const powerItems = [];
const FOOD_COUNT = 120;

function randomArenaPos(minDist){
  minDist = minDist||0;
  let x,z,d, tries=0;
  do{
    const ang = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random())*ARENA_RADIUS;
    x = Math.cos(ang)*r; z = Math.sin(ang)*r;
    d = Math.hypot(x - player.root.position.x, z - player.root.position.z);
    tries++;
  }while(d < minDist && tries<20);
  return new THREE.Vector3(x,0,z);
}
function spawnFood(){
  const geo = new THREE.SphereGeometry(0.35, 8, 8);
  const hue = 0.28 + Math.random()*0.15;
  const mat = new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hue,0.7,0.55), emissive:new THREE.Color().setHSL(hue,0.7,0.2)});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(randomArenaPos(6));
  mesh.position.y = 0.4;
  scene.add(mesh);
  foodItems.push({mesh, radius:0.5, value: 4 + Math.floor(Math.random()*6)});
}
for(let i=0;i<FOOD_COUNT;i++) spawnFood();

function spawnPowerItem(type){
  let geo, mat, scaleY=1;
  if(type==='star'){
    geo = new THREE.IcosahedronGeometry(0.55,0);
    mat = new THREE.MeshStandardMaterial({color:0xffd700, emissive:0xffaa00, emissiveIntensity:0.8});
  } else if(type==='shield'){
    geo = new THREE.SphereGeometry(0.5,10,10);
    mat = new THREE.MeshStandardMaterial({color:0x66e0ff, emissive:0x1fb8e0, emissiveIntensity:0.7, transparent:true, opacity:0.85});
  } else {
    geo = new THREE.ConeGeometry(0.35,0.9,6);
    mat = new THREE.MeshStandardMaterial({color:0xfff23f, emissive:0xd8b400, emissiveIntensity:0.8});
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(randomArenaPos(15));
  mesh.position.y = 0.6;
  scene.add(mesh);
  powerItems.push({mesh, radius:0.65, type});
}
spawnPowerItem('star'); spawnPowerItem('star');
spawnPowerItem('shield'); spawnPowerItem('shield');
spawnPowerItem('speed'); spawnPowerItem('speed');

/* ===================== 敵 (賢いAI) ===================== */
const enemies = [];
const ENEMY_COUNT = 16;
function spawnEnemy(){
  let lvl = player.level + Math.floor((Math.random()-0.5)*10);
  lvl = Math.max(1, Math.min(MAX_LEVEL, lvl));
  const root = new THREE.Group();
  const mesh = createCreatureMesh(lvl);
  root.add(mesh);
  root.position.copy(randomArenaPos(25));
  scene.add(root);
  const enemy = {
    root, mesh, level:lvl, radius:mesh.userData.radius,
    speed: ENEMY_BASE_SPEED + (Math.random()-0.5)*1.4,
    wanderTarget: randomArenaPos(0), retarget: 0,
    state:'wander', stateTimer:0, chaseCooldown:0, chaseElapsed:0, foodTarget:null
  };
  createEnemyLabel(enemy);
  enemies.push(enemy);
}
for(let i=0;i<ENEMY_COUNT;i++) spawnEnemy();

function rebuildEnemyMesh(enemy){
  enemy.root.remove(enemy.mesh);
  enemy.mesh = createCreatureMesh(enemy.level);
  enemy.root.add(enemy.mesh);
  enemy.mesh.add(enemy.labelSprite);
  enemy.radius = enemy.mesh.userData.radius;
  enemy.speed = ENEMY_BASE_SPEED + (Math.random()-0.5)*1.4;
}
/* 戦闘判定: 通常は大きい方が勝つが、格下にも一定確率で逆転のチャンスがある */
const UPSET_CHANCE = 0.07; // 格下が勝つ確率(常に一定。差が大きくても0にはならない)
function resolveCombat(radiusA, radiusB){
  // 戻り値: 'a' か 'b' (勝者)。サイズがほぼ同じなら null(勝敗つかず)
  if(radiusA > radiusB*1.05){
    return (Math.random() < UPSET_CHANCE) ? 'b' : 'a';
  } else if(radiusB > radiusA*1.05){
    return (Math.random() < UPSET_CHANCE) ? 'a' : 'b';
  }
  return null;
}
function findNearestFood(pos, maxDist){
  let best=null, bestD=maxDist;
  for(let i=0;i<foodItems.length;i++){
    const d = foodItems[i].mesh.position.distanceTo(pos);
    if(d < bestD){ bestD=d; best=foodItems[i]; }
  }
  return best;
}

function decideEnemyState(e, dt){
  const dx = player.root.position.x - e.root.position.x;
  const dz = player.root.position.z - e.root.position.z;
  const dist = Math.hypot(dx,dz);
  const ratio = e.radius / player.radius;
  const detect = 22 + e.radius*5;

  e.stateTimer -= dt;
  if(e.chaseCooldown>0) e.chaseCooldown -= dt;

  if(e.state==='chase'){
    e.chaseElapsed += dt;
    if(dist > detect*1.4 || e.chaseElapsed>7 || ratio<1.05 || !player.alive){
      e.state='wander'; e.stateTimer=1.5; e.chaseCooldown=4; e.chaseElapsed=0;
    }
  } else if(e.state==='flee'){
    if(dist > detect*1.6 || ratio>0.95){
      e.state='wander'; e.stateTimer=1.0;
    }
  } else {
    if(player.alive && dist < detect){
      if(ratio > 1.15 && e.chaseCooldown<=0){
        e.state='chase'; e.chaseElapsed=0; e.stateTimer=1;
      } else if(ratio < 0.9){
        e.state='flee'; e.stateTimer=1.2;
      }
    }
    if(e.state!=='flee' && e.state!=='chase' && e.stateTimer<=0){
      if(Math.random()<0.2){
        const f = findNearestFood(e.root.position, 32);
        if(f){ e.state='eat'; e.foodTarget=f; }
        else { e.state='wander'; e.wanderTarget = randomArenaPos(0); }
      } else {
        e.state='wander'; e.wanderTarget = randomArenaPos(0);
      }
      e.stateTimer = 2+Math.random()*2.5;
    }
  }
}

function updateEnemies(dt){
  for(let i=0;i<enemies.length;i++){
    const e = enemies[i];
    decideEnemyState(e, dt);
    updateEnemyLabel(e, dt);

    let dirVec = null;
    let speedMul = 1;
    if(e.state==='chase'){
      dirVec = new THREE.Vector3().subVectors(player.root.position, e.root.position);
      speedMul = 1.15;
    } else if(e.state==='flee'){
      dirVec = new THREE.Vector3().subVectors(e.root.position, player.root.position);
      speedMul = 1.25;
    } else if(e.state==='eat' && e.foodTarget){
      if(!foodItems.includes(e.foodTarget)){ e.state='wander'; e.wanderTarget = randomArenaPos(0); }
      else {
        dirVec = new THREE.Vector3().subVectors(e.foodTarget.mesh.position, e.root.position);
        if(dirVec.length() < 1.0){
          scene.remove(e.foodTarget.mesh);
          const idx = foodItems.indexOf(e.foodTarget);
          if(idx>=0) foodItems.splice(idx,1);
          spawnFood();
          e.foodTarget=null; e.state='wander'; e.wanderTarget = randomArenaPos(0);
        }
      }
    } else {
      e.retarget -= dt;
      if(e.retarget<=0){ e.wanderTarget = randomArenaPos(0); e.retarget = 3+Math.random()*3; }
      dirVec = new THREE.Vector3().subVectors(e.wanderTarget, e.root.position);
    }

    if(dirVec){
      dirVec.y=0;
      const len = dirVec.length();
      if(len>0.5){
        dirVec.normalize();
        e.root.position.x += dirVec.x * e.speed * speedMul * dt;
        e.root.position.z += dirVec.z * e.speed * speedMul * dt;
        e.root.rotation.y = Math.atan2(dirVec.x, dirVec.z);
      }
    }

    resolveObstacles(e.root.position, e.radius);
    const d = Math.hypot(e.root.position.x, e.root.position.z);
    if(d > ARENA_RADIUS){
      const scale = ARENA_RADIUS/d;
      e.root.position.x *= scale;
      e.root.position.z *= scale;
    }

    if(player.alive){
      const toPlayer = e.root.position.distanceTo(player.root.position);
      if(toPlayer < e.radius + player.radius){
        const winner = resolveCombat(player.radius, e.radius);
        if(winner==='a'){
          gainXp(15 + e.level*4);
          e.level = Math.max(1, Math.min(MAX_LEVEL, player.level + Math.floor((Math.random()-0.5)*10)));
          rebuildEnemyMesh(e);
          e.root.position.copy(randomArenaPos(25));
          e.state='wander'; e.chaseCooldown=2;
        } else if(winner==='b' && player.shieldTime<=0){
          loseGame(e.level);
        }
      }
    }
  }

  /* ボット同士の戦い(食べ合い)。格下にも逆転のチャンスあり */
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a = enemies[i], b = enemies[j];
      const dist = a.root.position.distanceTo(b.root.position);
      if(dist < a.radius + b.radius){
        const winner = resolveCombat(a.radius, b.radius);
        if(winner==='a'){
          b.level = Math.max(1, Math.min(MAX_LEVEL, player.level + Math.floor((Math.random()-0.5)*10)));
          rebuildEnemyMesh(b);
          b.root.position.copy(randomArenaPos(25));
          b.state='wander'; b.chaseCooldown=2;
        } else if(winner==='b'){
          a.level = Math.max(1, Math.min(MAX_LEVEL, player.level + Math.floor((Math.random()-0.5)*10)));
          rebuildEnemyMesh(a);
          a.root.position.copy(randomArenaPos(25));
          a.state='wander'; a.chaseCooldown=2;
        }
      }
    }
  }
}

/* ===================== 入力 (ジョイスティック + キーボード + ダッシュ) ===================== */
const moveVec = {x:0, y:0};
const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');
let joyActive = false, joyTouchId = null, joyCenter = {x:0,y:0};
const JOY_MAX = 40;

function joyStart(x,y,id){
  joyActive = true; joyTouchId = id;
  const rect = joyBase.getBoundingClientRect();
  joyCenter = {x: rect.left+rect.width/2, y: rect.top+rect.height/2};
  joyMove(x,y);
}
function joyMove(x,y){
  if(!joyActive) return;
  let dx = x - joyCenter.x, dy = y - joyCenter.y;
  const dist = Math.hypot(dx,dy);
  if(dist > JOY_MAX){ dx = dx/dist*JOY_MAX; dy = dy/dist*JOY_MAX; }
  joyKnob.style.left = (30+dx)+'px';
  joyKnob.style.top = (30+dy)+'px';
  moveVec.x = dx/JOY_MAX;
  moveVec.y = -dy/JOY_MAX;
}
function joyEnd(){
  joyActive = false; joyTouchId = null;
  joyKnob.style.left = '30px'; joyKnob.style.top = '30px';
  moveVec.x = 0; moveVec.y = 0;
}
joyBase.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY, t.identifier);
}, {passive:false});
joyBase.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){ if(t.identifier===joyTouchId) joyMove(t.clientX,t.clientY); }
}, {passive:false});
joyBase.addEventListener('touchend', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){ if(t.identifier===joyTouchId) joyEnd(); }
}, {passive:false});
joyBase.addEventListener('mousedown', e=>{ joyStart(e.clientX, e.clientY, 'mouse'); });
window.addEventListener('mousemove', e=>{ if(joyTouchId==='mouse') joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', e=>{ if(joyTouchId==='mouse') joyEnd(); });

const keys = {};
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; if(e.key===' ') triggerDash(); });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function keyboardVec(){
  let x=0,y=0;
  if(keys['w']||keys['arrowup']) y+=1;
  if(keys['s']||keys['arrowdown']) y-=1;
  if(keys['a']||keys['arrowleft']) x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  const len = Math.hypot(x,y);
  if(len>0){ x/=len; y/=len; }
  return {x,y};
}

/* ダッシュ */
let stamina = 100, dashTime = 0;
const dashBtnWrap = document.getElementById('dashBtnWrap');
const dashRing = document.getElementById('dashRing');
function triggerDash(){
  if(stamina>=30 && dashTime<=0){
    stamina -= 30;
    dashTime = 1.6;
  }
}
dashBtnWrap.addEventListener('touchstart', e=>{ e.preventDefault(); triggerDash(); }, {passive:false});
dashBtnWrap.addEventListener('mousedown', e=>{ triggerDash(); });

/* ===================== HUD 更新 ===================== */
const elLevelNumInner = document.getElementById('levelNumInner');
const elStageName = document.getElementById('stageName');
const elXpInner = document.getElementById('xpBarInner');
const elStatSize = document.getElementById('statSize');
const elStatXp = document.getElementById('statXp');
const elLevelFlash = document.getElementById('levelUpFlash');
const elBuffShield = document.getElementById('buffShield');
const elBuffSpeed = document.getElementById('buffSpeed');

function updateHud(){
  elLevelNumInner.textContent = player.level;
  elStageName.textContent = STAGE_NAMES[player.level-1];
  const needed = xpNeeded(player.level);
  const pct = player.level>=MAX_LEVEL ? 100 : Math.min(100, (player.xp/needed)*100);
  elXpInner.style.width = pct+'%';
  elStatSize.textContent = player.radius.toFixed(2);
  elStatXp.textContent = player.level>=MAX_LEVEL ? 'MAX' : (needed-player.xp)+' XP';
  elBuffShield.style.display = player.shieldTime>0 ? 'inline-block' : 'none';
  elBuffSpeed.style.display = player.speedBoostTime>0 ? 'inline-block' : 'none';
  dashRing.style.setProperty('--pct', Math.round(stamina));
}
updateHud();

let flashTimeout = null;
function showLevelUp(){
  elLevelFlash.querySelector('.sub').textContent = 'Lv.'+player.level+' 「'+STAGE_NAMES[player.level-1]+'」に進化！';
  elLevelFlash.style.opacity = '1';
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(()=>{ elLevelFlash.style.opacity='0'; }, 1800);
}
function gainXp(amount){
  if(player.level>=MAX_LEVEL){ return; }
  player.xp += amount;
  let leveled = false;
  while(player.level < MAX_LEVEL && player.xp >= xpNeeded(player.level)){
    player.xp -= xpNeeded(player.level);
    player.level++;
    leveled = true;
  }
  if(player.level>=MAX_LEVEL) player.xp = 0;
  if(leveled){ rebuildPlayerMesh(); showLevelUp(); }
  updateHud();
}

/* ===================== ゲームオーバー / スタート ===================== */
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverText = document.getElementById('gameOverText');
const restartBtn = document.getElementById('restartBtn');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
let gameRunning = false;

function loseGame(byLevel){
  player.alive = false;
  gameOverText.textContent = 'Lv.'+player.level+'「'+STAGE_NAMES[player.level-1]+'」で、Lv.'+byLevel+'の生き物に食べられてしまった…';
  gameOverOverlay.style.display = 'flex';
  gameRunning = false;
}
function resetGame(){
  player.level = 1; player.xp = 0; player.alive = true;
  player.shieldTime = 0; player.speedBoostTime = 0;
  player.root.position.set(0,0,0);
  rebuildPlayerMesh();
  updateHud();
  gameOverOverlay.style.display = 'none';
  gameRunning = true;
}
restartBtn.addEventListener('click', resetGame);
startBtn.addEventListener('click', ()=>{ startOverlay.style.display = 'none'; gameRunning = true; });

/* ===================== ミニマップ ===================== */
const minimapCanvas = document.getElementById('minimapCanvas');
const mctx = minimapCanvas.getContext('2d');
function drawMinimap(){
  const W = minimapCanvas.width, H = minimapCanvas.height;
  mctx.clearRect(0,0,W,H);
  mctx.fillStyle = 'rgba(20,50,25,0.9)';
  mctx.beginPath(); mctx.arc(W/2,H/2,W/2,0,Math.PI*2); mctx.fill();
  const scale = (W/2-6)/ARENA_RADIUS;
  const cx=W/2, cy=H/2;
  mctx.fillStyle = 'rgba(150,255,150,0.55)';
  foodItems.forEach(f=>{
    mctx.beginPath();
    mctx.arc(cx+f.mesh.position.x*scale, cy+f.mesh.position.z*scale, 1.4,0,Math.PI*2);
    mctx.fill();
  });
  enemies.forEach(e=>{
    mctx.fillStyle = e.labelState==='danger' ? '#ff5b4d' : (e.labelState==='prey' ? '#4dff8a' : '#c9c9c9');
    mctx.beginPath();
    mctx.arc(cx+e.root.position.x*scale, cy+e.root.position.z*scale, 2.6,0,Math.PI*2);
    mctx.fill();
  });
  mctx.save();
  mctx.translate(cx+player.root.position.x*scale, cy+player.root.position.z*scale);
  mctx.rotate(player.facing);
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.moveTo(0,-5); mctx.lineTo(4,4); mctx.lineTo(-4,4); mctx.closePath(); mctx.fill();
  mctx.restore();
}

/* ===================== メインループ ===================== */
const clock = new THREE.Clock();
const camOffset = { dist: 9, height: 5 };

function updatePlayer(dt){
  const kb = keyboardVec();
  const mvx = moveVec.x !== 0 || moveVec.y !== 0 ? moveVec.x : kb.x;
  const mvy = moveVec.x !== 0 || moveVec.y !== 0 ? moveVec.y : kb.y;
  const moving = (mvx*mvx + mvy*mvy) > 0.01;

  if(dashTime>0){ dashTime -= dt; }
  if(stamina<100 && dashTime<=0){ stamina = Math.min(100, stamina + dt*14); }

  let curSpeed = player.speed;
  if(dashTime>0) curSpeed *= 1.8;
  if(player.speedBoostTime>0) curSpeed *= 1.5;

  /* ステアリング式操作: スティック上 = 常に「今キャラが向いている方向」へ前進。
     左右 = その場で旋回(ワールド座標の北などに固定されない)。 */
  const TURN_SPEED = 2.6; // rad/sec
  if(moving){
    player.facing -= mvx * TURN_SPEED * dt;
    player.root.rotation.y = player.facing;

    const forward = new THREE.Vector3(Math.sin(player.facing), 0, Math.cos(player.facing));
    const moveAmount = mvy; // 前進(正)/後退(負、低速)
    const mult = moveAmount >= 0 ? moveAmount : moveAmount*0.5;
    player.root.position.x += forward.x * mult * curSpeed * dt;
    player.root.position.z += forward.z * mult * curSpeed * dt;
  }

  resolveObstacles(player.root.position, player.radius);
  const d = Math.hypot(player.root.position.x, player.root.position.z);
  if(d > ARENA_RADIUS){
    const scale = ARENA_RADIUS/d;
    player.root.position.x *= scale;
    player.root.position.z *= scale;
  }

  if(player.shieldTime>0) player.shieldTime -= dt;
  if(player.speedBoostTime>0) player.speedBoostTime -= dt;

  speedZones.forEach(z=>{
    const dd = Math.hypot(player.root.position.x-z.x, player.root.position.z-z.z);
    if(dd < z.radius) curSpeed *= 1; // ゾーン内は上のspeedBoostと同様に扱う(視覚のみ簡易)
  });
  poisonZones.forEach(z=>{
    const dd = Math.hypot(player.root.position.x-z.x, player.root.position.z-z.z);
    if(dd < z.radius && player.xp>0){
      player.xp = Math.max(0, player.xp - dt*3);
      updateHud();
    }
  });
}

function updateCamera(dt){
  const forward = new THREE.Vector3(Math.sin(player.facing),0,Math.cos(player.facing));
  const desired = new THREE.Vector3(
    player.root.position.x - forward.x*camOffset.dist,
    camOffset.height + player.radius*1.5,
    player.root.position.z - forward.z*camOffset.dist
  );
  camera.position.lerp(desired, Math.min(1, dt*4));
  const lookAt = player.root.position.clone();
  lookAt.y += player.radius*0.6;
  camera.lookAt(lookAt);
}

function updateFood(){
  for(let i=foodItems.length-1;i>=0;i--){
    const f = foodItems[i];
    f.mesh.rotation.y += 0.02;
    const dist = f.mesh.position.distanceTo(player.root.position);
    if(dist < player.radius + f.radius){
      scene.remove(f.mesh);
      foodItems.splice(i,1);
      gainXp(f.value);
      spawnFood();
    }
  }
}
function updatePowerItems(dt){
  for(let i=powerItems.length-1;i>=0;i--){
    const p = powerItems[i];
    p.mesh.rotation.y += dt*2.2;
    p.mesh.position.y = 0.6 + Math.sin(Date.now()*0.003 + i)*0.15;
    const dist = p.mesh.position.distanceTo(player.root.position);
    if(dist < player.radius + p.radius){
      scene.remove(p.mesh);
      powerItems.splice(i,1);
      if(p.type==='star') gainXp(30);
      else if(p.type==='shield') player.shieldTime = 6;
      else if(p.type==='speed') player.speedBoostTime = 6;
      updateHud();
      setTimeout(()=>spawnPowerItem(p.type), 12000 + Math.random()*8000);
    }
  }
}

let minimapTimer = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if(gameRunning && player.alive){
    updatePlayer(dt);
    updateFood();
    updatePowerItems(dt);
    updateEnemies(dt);
  }
  updateCamera(dt);
  minimapTimer -= dt;
  if(minimapTimer<=0){ drawMinimap(); minimapTimer = 0.15; }
  updateHud();
  renderer.render(scene, camera);
}
animate();

})();
